name = "bao-diem-cva"
main = "worker.js"
compatibility_date = "2024-09-23"

# Biên dịch trực tiếp index.html thành text module trong Worker
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Cấu hình Cloudflare D1 Database (Serverless SQLite)
[[d1_databases]]
binding = "DB"
database_name = "bao_diem_db"
database_id = "e2576172-1ea6-47e1-9ac9-33010cfa790a"

# Cấu hình Cloudflare R2 Bucket (Lưu trữ 1.341+ file PDF)
[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "bao-diem-pdf"
