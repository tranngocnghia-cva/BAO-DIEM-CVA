name = "bao-diem-cva"
main = "worker.js"
compatibility_date = "2024-09-23"

# Biên dịch trực tiếp index.html thành text module trong Worker
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Cấu hình Cloudflare D1 Database (Serverless SQLite)
[[d1_databases]]
binding = "DB"
database_name = "bao-diem-cva"
database_id = "08a0e1fa-bbf0-4c2d-b511-952da6fea788"

# Cấu hình Cloudflare R2 Bucket (Bật khi Thầy tạo bucket bao-diem-pdf trên Cloudflare)
# [[r2_buckets]]
# binding = "PDF_BUCKET"
# bucket_name = "bao-diem-pdf"
